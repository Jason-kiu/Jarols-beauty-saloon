<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarols Beauty Saloon</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; }
    header { background: #f7f7f7; padding: 20px; text-align: center; }
    .services { padding: 20px; display: flex; flex-wrap: wrap; justify-content: center; }
    .service-card { margin: 10px; width: 250px; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .service-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px 10px 0 0; }
    .service-info { padding: 10px; }
    .cta { background: #25D366; color: white; padding: 10px; border: none; cursor: pointer; width: 100%; border-radius: 5px; }
    #inquiry-form { padding: 20px; background: #f2f2f2; margin: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Jarols Beauty Saloon</h1>
    <p>Professional beauty services in Ishaka</p>
  </header>
  <section class="services">
    <!-- Services will be listed here -->
  </section>
  <section id="inquiry-form">
    <h2>Get in Touch</h2>
    <form id="contact-form">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="text" id="phone" placeholder="Your Phone Number" required>
      <textarea id="message" placeholder="Your Message"></textarea>
      <button type="submit">Send Inquiry</button>
    </form>
  </section>
  <script>
    const whatsappNumber = "256767037952"; // or "256752325259"
    const services = [
      { name: "Bridal services", price: "UGX 50,000", image: "bridal.jpg" },
      { name: "Hair plaiting", price: "UGX 15,000", image: "plaiting.jpg" },
      { name: "Hair styling", price: "UGX 20,000", image: "styling.jpg" },
      { name: "Men hair cuts", price: "UGX 10,000", image: "mens-cut.jpg" },
      { name: "Hair relaxing", price: "UGX 25,000", image: "relaxing.jpg" },
      { name: "Nails", price: "UGX 8,000", image: "nails.jpg" },
      { name: "Weaving", price: "UGX 30,000", image: "weaving.jpg" },
      { name: "Training (Note: TRAINING AVAILABLE)", price: "UGX 100,000", image: "training.jpg" }
    ];
    const servicesSection = document.querySelector('.services');
    services.forEach(service => {
      servicesSection.innerHTML += `
        <div class="service-card">
          <img src="${service.image}" alt="${service.name}">
          <div class="service-info">
            <h3>${service.name}</h3>
            <p>Price: ${service.price}</p>
            <a href="https://wa.me/${whatsappNumber}?text=Hi, I'd like to book ${service.name}" target="_blank">
              <button class="cta">Book Now</button>
            </a>
          </div>
        </div>
      `;
    });

    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const message = document.getElementById('message').value;
      const whatsappLink = `https://wa.me/${whatsappNumber}?text=Hi, I'm ${name}. ${message}`;
      window.open(whatsappLink, '_blank');
    });
  </script>
</body>
</html>
